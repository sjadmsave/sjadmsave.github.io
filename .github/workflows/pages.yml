name: Publish APK Studio Cloud website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Android APK release
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sjadmsave.github.io"
          APK="APK-Studio-Cloud-1.8.1-Stable-signed.apk"
          SHA="04e98ef7d7706e88dbe94fe10aa029bb771205910dd39a842b2e418f06e6e80b"
          curl --fail --silent --show-error --location --retry 18 --retry-delay 8 --retry-all-errors --retry-max-time 180 -o /tmp/apkstudio-public.apk "$BASE/downloads/$APK"
          echo "$SHA  /tmp/apkstudio-public.apk" | sha256sum --check
          for page in / /download.html /privacy.html /terms.html; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null "$BASE$page"
          done
          echo "Verified public website and signed APK binary."
      - name: Verify Almanhaj storefront and published catalog
        run: |
          set -euo pipefail
          BASE="https://sjadmsave.github.io/almanhaj"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors -o /tmp/almanhaj.html "$BASE/"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors -o /tmp/almanhaj-catalog.json "$BASE/catalog.json"
          grep -q 'المنهج' /tmp/almanhaj.html
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/almanhaj-catalog.json'))
          assert d.get('schema') == 1 and isinstance(d.get('apps'), list)
          assert all(x.get('status') == 'published' for x in d['apps'])
          print('Almanhaj public site and approved catalog verified')
          PY


